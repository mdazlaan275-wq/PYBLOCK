<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom PyBlock Core</title>
    
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly/python_compressed.js"></script>
    
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { padding: 10px; background: #333; color: white; display: flex; justify-content: space-between; align-items: center;}
        #workspace-container { display: flex; flex: 1; }
        #blocklyDiv { height: 100%; width: 60%; }
        #outputPanel { height: 100%; width: 40%; background: #1e1e1e; color: #00ff00; padding: 10px; box-sizing: border-box; overflow-y: auto; font-family: monospace; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold;}
        button:disabled { background: #888; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h2>My Custom PyBlock Environment</h2>
        <button id="runBtn" onclick="runCode()" disabled>Loading Python...</button>
    </header>

    <div id="workspace-container">
        <div id="blocklyDiv"></div>
        
        <div id="outputPanel">Terminal Output Will Appear Here...<br><br></div>
    </div>

    <xml id="toolbox" style="display: none">
        <category name="Logic" colour="%{BKY_LOGIC_HUE}">
            <block type="controls_if"></block>
            <block type="logic_compare"></block>
        </category>
        <category name="Math" colour="%{BKY_MATH_HUE}">
            <block type="math_number"></block>
            <block type="math_arithmetic"></block>
        </category>
        <category name="Text" colour="%{BKY_TEXTS_HUE}">
            <block type="text"></block>
            <block type="text_print"></block>
        </category>
    </xml>

    <script>
        // 1. Initialize Blockly Workspace
        var workspace = Blockly.inject('blocklyDiv', {
            toolbox: document.getElementById('toolbox'),
            grid: {spacing: 20, length: 3, colour: '#ccc', snap: true}
        });

        // 2. Initialize Pyodide (Python Engine)
        let pyodideReadyPromise;
        async function initPyodide() {
            let pyodide = await loadPyodide({
                stdout: (text) => appendOutput(text) // Redirect Python prints to our HTML div
            });
            document.getElementById('runBtn').innerText = "▶ Run Code";
            document.getElementById('runBtn').disabled = false;
            return pyodide;
        }
        pyodideReadyPromise = initPyodide();

        // Helper function to print to our web terminal
        function appendOutput(text) {
            document.getElementById('outputPanel').innerHTML += text + "<br>";
        }

        // 3. The Run Function (With the Async Fix for time.sleep)
        async function runCode() {
            let pyodide = await pyodideReadyPromise;
            
            // Clear previous output
            document.getElementById('outputPanel').innerHTML = "Running...<br><br>";

            // Generate Python code from Blocks
            var userCode = Blockly.Python.workspaceToCode(workspace);

            // Wrap code in Async to prevent browser freeze (fixes the 'time' module issue)
            let asyncWrapper = `
import asyncio
import time

# Patch time.sleep for the browser
async def custom_sleep(seconds):
    await asyncio.sleep(seconds)
time.sleep = custom_sleep

async def main():
${userCode.split('\\n').map(line => '    ' + line).join('\\n')} # Auto-indent user code

await main()
`;

            try {
                await pyodide.runPythonAsync(asyncWrapper);
                appendOutput("<br><i>--- Program Finished ---</i>");
            } catch (err) {
                appendOutput("<span style='color:red'>" + err + "</span>");
            }
        }
    </script>
</body>
</html>
